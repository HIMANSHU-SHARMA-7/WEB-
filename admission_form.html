<html>
    <head>
        <title>
            Admission Form
        </title>
    </head>
    <body>
        <h1>Admission Form</h1>
        <form>
        <p>
            Enter Your Name :
        </p>
        <input placeholder = "Name" required>
        <p>
            Enter Your Age :
        </p>
        <input type = "number" min = "1" placeholder = "Age" required>
        <p>Enter Your Date of Birth</p>
        <input type = "date" required>
        <p>Enter Your Email :</p>
        <input type = "email" placeholder = "Email@example.com" required>
        <p>Select Your Gender :</p>
        <input type = "radio" name = "gender" required>
        <label>Male</label>
        <input type = "radio" name = "gender" required>
        <label>Female</label>
        <p>Select Your Branch :</p>
        <input type = "radio" name = "branch" required>
        <label>C.S.E</label>
        <input type = "radio" name = "branch" required>
        <label>Electrical</label>
        <input type = "radio" name = "branch" required>
        <label>E&C</label>
        <input type = "radio" name = "branch" required>
        <label>Civil</label>
        <input type = "radio" name = "branch" required>
        <label>Mechanical</label>
        <p>Click "CLEAR DETAILS" to clear your details</p>
        <button type = "reset">CLEAR DETAILS</button>
        <p>Click "SUBMIT FROM" to submit your form</p>
        <button type = "submit">SUBMIT FROM</button>

        </form>
 </body>
</html>
